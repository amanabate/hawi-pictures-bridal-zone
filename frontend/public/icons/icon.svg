
  <svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#141008" />
        <stop offset="50%" stop-color="#0B0803" />
        <stop offset="100%" stop-color="#050301" />
      </linearGradient>

      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE047" />
        <stop offset="30%" stop-color="#FCD535" />
        <stop offset="70%" stop-color="#EAB308" />
        <stop offset="100%" stop-color="#C9A24D" />
      </linearGradient>

      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF2B2" />
        <stop offset="50%" stop-color="#EAB308" />
        <stop offset="100%" stop-color="#936F22" />
      </linearGradient>

      <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="10.24" result="glow" />
        <feComposite in="SourceGraphic" in2="glow" operator="over" />
      </filter>
    </defs>

    <!-- Full bleed background for maskable compliance -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Outer Gold Luxury Ring -->
    <circle cx="256" cy="256" r="235.52" fill="none" stroke="url(#ringGrad)" stroke-width="12.8" filter="url(#goldGlow)" />
    <circle cx="256" cy="256" r="221.3888" fill="none" stroke="url(#goldGrad)" stroke-width="4.096" stroke-dasharray="10.24 7.68" opacity="0.75" />

    <!-- Inner Crest Fill -->
    <circle cx="256" cy="256" r="207.2576" fill="#141008" stroke="url(#ringGrad)" stroke-width="5.12" />

    <!-- Stylized Camera Aperture / Crown Rays -->
    <g transform="translate(256, 256)">
      <!-- 8 Aperture Blades / Rays -->
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(0)" opacity="0.65" />
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(45)" opacity="0.65" />
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(90)" opacity="0.65" />
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(135)" opacity="0.65" />
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(180)" opacity="0.65" />
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(225)" opacity="0.65" />
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(270)" opacity="0.65" />
      
        <line x1="0" y1="-113.0496" x2="0" y2="-188.41600000000003" stroke="url(#goldGrad)" stroke-width="6.144" stroke-linecap="round" transform="rotate(315)" opacity="0.65" />
      

      <!-- Center Ornate Monogram Letter 'H' -->
      <path d="
        M -66.56 -81.92 
        L -35.84 -81.92 
        L -35.84 -15.36 
        L 35.84 -15.36 
        L 35.84 -81.92 
        L 66.56 -81.92 
        L 66.56 81.92 
        L 35.84 81.92 
        L 35.84 15.36 
        L -35.84 15.36 
        L -35.84 81.92 
        L -66.56 81.92 Z
      " fill="url(#goldGrad)" filter="url(#goldGlow)" />

      <!-- Center Bridal Diamond Sparkle (Top) -->
      <path d="
        M 0 -112.64
        Q 0 -92.16 20.48 -92.16
        Q 0 -92.16 0 -71.68
        Q 0 -92.16 -20.48 -92.16
        Q 0 -92.16 0 -112.64 Z
      " fill="#FFFBEB" />

      <!-- Sparkle at Bottom -->
      <path d="
        M 0 112.64
        Q 0 92.16 15.36 92.16
        Q 0 92.16 0 71.68
        Q 0 92.16 -15.36 92.16
        Q 0 92.16 0 112.64 Z
      " fill="url(#goldGrad)" />
    </g>
  </svg>
  